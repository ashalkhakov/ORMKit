<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Fontconfig for the bundled fonts, plus whatever the host has.

     A diagram is measured in its fonts. Shipping a set means a model lays
     out the same way on a machine that has none of them installed, which is
     the difference between a label that fits its shape and one that spills. -->
<fontconfig>
  <dir prefix="relative">../share/fonts</dir>
  <dir>/usr/share/fonts</dir>
  <dir>~/.fonts</dir>
  <cachedir prefix="xdg">fontconfig</cachedir>
  <config><rescan><int>30</int></rescan></config>
</fontconfig>
