name: Release

# Tag a version to publish, or run it by hand to get the artifacts without
# creating a release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ############################ Linux AppImage ############################
  appimage:
    name: Linux AppImage
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SRC_PATH: ${{ github.workspace }}/source
      DEPS_PATH: ${{ github.workspace }}/dependencies
      INSTALL_PATH: ${{ github.workspace }}/build
      CC: clang
      CXX: clang++
      LIBRARY_COMBO: ng-gnu-gnu
      RUNTIME_VERSION: gnustep-2.0
      # The shared repository the GNUstep fixes come from, and the pin that
      # decides which of them this build gets. It is part of the cache key
      # below, so moving it rebuilds the stack rather than reusing a prefix
      # patched differently. Name a commit here to pin the build exactly.
      GNUSTEP_PATCHES_REF: 6eee3cc7bc1c751b88877b3fe4a6581517cccecb
      # See the note in ci.yml: the gnustep layout does not treat the prefix's
      # plain lib/ as a library root, but libobjc2 and libdispatch live there.
      LD_LIBRARY_PATH: ${{ github.workspace }}/build/lib
    defaults:
      run:
        working-directory: ${{ env.SRC_PATH }}

    steps:
      - uses: actions/checkout@v4
        with:
          path: ${{ env.SRC_PATH }}

      - name: Version
        run: |
          if [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
            echo "APP_VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_ENV"
          else
            echo "APP_VERSION=0.0.0-build${{ github.run_number }}" >> "$GITHUB_ENV"
          fi

      - name: Install packages
        run: |
          ./.github/scripts/apt-update.sh
          sudo apt-get -q -y install \
            pkg-config libgnutls28-dev libffi-dev libicu-dev libxml2-dev libxslt1-dev \
            libssl-dev libavahi-client-dev zlib1g-dev gnutls-bin libcurl4-gnutls-dev \
            libgmp-dev libcairo2-dev libjpeg-dev libtiff-dev libpng-dev libicns-dev \
            libpthread-workqueue-dev \
            libxt-dev libxmu-dev libxft-dev libxrandr-dev libxfixes-dev libxcursor-dev \
            fuse libfuse2 desktop-file-utils \
            fonts-dejavu fonts-liberation
          if [ -x /usr/bin/ld.gold ]; then
            sudo update-alternatives --install /usr/bin/ld ld /usr/bin/ld.gold 10
          else
            sudo apt-get -q -y install lld
            sudo update-alternatives --install /usr/bin/ld ld /usr/bin/ld.lld 10
          fi

      # The same stack, the same script and the same cache key as CI, so a
      # release does not rebuild what a push already built. Restore only: this
      # job installs into the prefix to package it, so it must never write the
      # result back. See the note in ci.yml.
      - name: Restore GNUstep
        id: gnustep-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.INSTALL_PATH }}
          key: gnustep-v2-${{ runner.os }}-${{ hashFiles('source/.github/scripts/dependencies.sh') }}-${{ env.GNUSTEP_PATCHES_REF }}

      - name: Build GNUstep
        if: steps.gnustep-cache.outputs.cache-hit != 'true'
        run: ./.github/scripts/dependencies.sh

      - name: Fetch linuxdeploy and the AppImage runtime
        run: ./Scripts/install-linuxdeploy.sh

      - name: Stamp the version
        run: ./Scripts/stamp-version.sh "$APP_VERSION"

      - name: Assemble AppDir
        run: GNUSTEP_PREFIX="$INSTALL_PATH" ./Scripts/prepare-appdir.sh

      - name: Package the AppImage
        env:
          LDAI_RUNTIME_FILE: /tmp/appimage-runtime/runtime-x86_64
        run: GNUSTEP_PREFIX="$INSTALL_PATH" ./Scripts/package-appimage.sh

      # Proof it starts: ormtool needs no display, so a broken bundle fails
      # here rather than for whoever downloads it.
      - name: Smoke-test the AppImage
        run: |
          image=$(ls ORMKit-Linux-*.AppImage)
          chmod +x "$image"
          ./"$image" ormtool check ORMKitTests/Fixtures/StockMate.orm

      - uses: actions/upload-artifact@v4
        with:
          name: ORMKit-Linux-${{ env.APP_VERSION }}
          path: ${{ env.SRC_PATH }}/ORMKit-Linux-*.AppImage

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.SRC_PATH }}/ORMKit-Linux-*.AppImage

  ############################ macOS ############################
  macos:
    name: macOS (signed)
    runs-on: macos-15
    timeout-minutes: 45
    # The signing and notarisation secrets live in this environment, and an
    # environment's secrets are only readable by a job that names it: without
    # this line every one of them resolves to the empty string and the job
    # ships an unsigned build, saying so and passing.
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Version
        run: |
          if [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
            echo "APP_VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_ENV"
          else
            echo "APP_VERSION=0.0.0-build${{ github.run_number }}" >> "$GITHUB_ENV"
          fi

      - name: Stamp the version
        run: ./Scripts/stamp-version.sh "$APP_VERSION"

      - name: Build
        run: |
          for scheme in ORMKit ORMDesigner Tools/ormtool; do
            xcodebuild -project ORMKit.xcodeproj -scheme "$scheme" \
              -destination 'platform=macOS' -configuration Release build
          done

      # Signing is skipped, loudly, when the certificate secrets are absent, so
      # a fork or a dry run still produces artifacts -- unsigned, and named so.
      - name: Sign
        id: sign
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          if [ -z "$CERTIFICATE" ] || [ -z "$IDENTITY" ]; then
            echo "::warning::MACOS_CERTIFICATE or MACOS_SIGN_IDENTITY not set; shipping unsigned"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          keychain=$RUNNER_TEMP/signing.keychain-db
          password=$(uuidgen)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$password" "$keychain" > /dev/null
          security list-keychain -d user -s "$keychain" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"

          built=$(xcodebuild -project ORMKit.xcodeproj -scheme ORMDesigner \
                    -destination 'platform=macOS' -configuration Release \
                    -showBuildSettings 2>/dev/null \
                  | awk -F' = ' '/ BUILT_PRODUCTS_DIR/{print $2; exit}')
          echo "BUILT=$built" >> "$GITHUB_ENV"
          # --options runtime is what notarization requires; sign the framework
          # before the app that embeds it, or the outer signature is stale.
          codesign --force --timestamp --options runtime \
                   --sign "$IDENTITY" "$built/ORMKit.framework"
          codesign --force --timestamp --options runtime \
                   --sign "$IDENTITY" "$built/ormtool"
          codesign --force --timestamp --options runtime --deep \
                   --sign "$IDENTITY" "$built/ORMDesigner.app"
          codesign --verify --strict --verbose=2 "$built/ORMDesigner.app"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Notarize
        if: steps.sign.outputs.signed == 'true'
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          # Checked here rather than in `if:`, where a step's own env block is
          # not reliably visible to its own condition -- the step would be
          # skipped whatever the secrets said, and a signed-but-unnotarized app
          # that Gatekeeper still refuses would ship from a green run.
          if [ -z "$NOTARY_APPLE_ID" ] || [ -z "$NOTARY_TEAM_ID" ] || [ -z "$NOTARY_PASSWORD" ]; then
            echo "::warning::NOTARY_* secrets not set; signed but not notarized"
            exit 0
          fi
          ditto -c -k --keepParent "$BUILT/ORMDesigner.app" "$RUNNER_TEMP/ORMDesigner-notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/ORMDesigner-notarize.zip" \
            --apple-id "$NOTARY_APPLE_ID" --team-id "$NOTARY_TEAM_ID" \
            --password "$NOTARY_PASSWORD" --wait
          xcrun stapler staple "$BUILT/ORMDesigner.app"

      - name: Package
        run: |
          built=${BUILT:-$(xcodebuild -project ORMKit.xcodeproj -scheme ORMDesigner \
                    -destination 'platform=macOS' -configuration Release \
                    -showBuildSettings 2>/dev/null \
                  | awk -F' = ' '/ BUILT_PRODUCTS_DIR/{print $2; exit}')}
          suffix=""
          [ "${{ steps.sign.outputs.signed }}" = "true" ] || suffix="-unsigned"
          # ormtool links @rpath/ORMKit.framework, so the executable on its
          # own will not start. Ship it beside the framework it needs.
          rm -rf "$RUNNER_TEMP/ormtool" && mkdir -p "$RUNNER_TEMP/ormtool"
          cp "$built/ormtool" "$RUNNER_TEMP/ormtool/"
          cp -R "$built/ORMKit.framework" "$RUNNER_TEMP/ormtool/"
          ditto -c -k --keepParent "$built/ORMDesigner.app" \
            "ORMKit-macOS-${APP_VERSION}${suffix}.zip"
          ditto -c -k --keepParent "$RUNNER_TEMP/ormtool" \
            "ormtool-macOS-${APP_VERSION}${suffix}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ORMKit-macOS-${{ env.APP_VERSION }}
          path: |
            ORMKit-macOS-*.zip
            ormtool-macOS-*.zip

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ORMKit-macOS-*.zip
            ormtool-macOS-*.zip
