# ORMKit's AppImage: ORMDesigner, and ormtool beside it. The image is
# gnustep-release-actions' appimage (the launcher, the runtime, the fonts),
# the same as every app's; see its appimage.sh for each name.
# Not "-Linux": an .AppImage says what it is for (AppImage asks names not to).
IMAGE=ORMKit
NAME=ORMDesigner
APPS="ORMDesigner"
TOOLS="ormtool"
DEFAULT=ORMDesigner
#   <image> ormtool check model.orm     ln -s <image> ormtool
ROUTES="ormtool=ormtool designer,ormdesigner=ORMDesigner"
# A model's path: the designer opens it.
WITH_FILE=ORMDesigner
ENTRIES="Scripts/appimage/ORMDesigner.desktop=ORMDesigner/ORMDesigner.png"
# On a clean Ubuntu: ormtool checks the StockMate model (no display needed).
SMOKE="ormtool check ORMKitTests/Fixtures/StockMate.orm"
