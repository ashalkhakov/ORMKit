# ORMKit's Windows installer: ORMDesigner, and ormtool beside it in the
# runtime. The installer is gnustep-release-actions' msi (the runtime,
# WinUXTheme), the same as every app's; see its msi.sh for each name.
NAME=ORMDesigner
APPS="ORMDesigner"
DEFAULT=ORMDesigner
ICON=ORMDesigner/ORMDesigner.png
SUMMARY="Model with Object-Role Modeling: ORMDesigner, and ormtool to check, verbalize and map models"
# No self-test: started bare the designer is still up 25 seconds later, its
# interface loaded.
SMOKE_STAYS_UP=25
